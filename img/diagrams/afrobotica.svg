<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="680" height="200" fill="#ffffff"/>

  <rect x="14" y="50" width="112" height="80" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="70" y="78" font-size="12" font-weight="600" fill="#333" text-anchor="middle">Visitor</text>
  <text x="70" y="96" font-size="10.5" fill="#777" text-anchor="middle">unscripted question</text>
  <text x="70" y="111" font-size="10.5" fill="#777" text-anchor="middle">via microphone</text>

  <rect x="150" y="50" width="112" height="80" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="206" y="78" font-size="12" font-weight="600" fill="#333" text-anchor="middle">Whisper</text>
  <text x="206" y="96" font-size="10.5" fill="#777" text-anchor="middle">speech-to-text</text>
  <text x="206" y="111" font-size="10.5" fill="#777" text-anchor="middle">local</text>

  <rect x="286" y="50" width="112" height="80" rx="8" fill="#4a7db5"/>
  <text x="342" y="73" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Qwen2.5-7B</text>
  <text x="342" y="91" font-size="10.5" fill="#dce8f5" text-anchor="middle">via Ollama</text>
  <text x="342" y="106" font-size="10.5" fill="#dce8f5" text-anchor="middle">character knowledge</text>
  <text x="342" y="121" font-size="10.5" fill="#dce8f5" text-anchor="middle">on-device</text>

  <rect x="422" y="50" width="112" height="80" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="478" y="78" font-size="12" font-weight="600" fill="#333" text-anchor="middle">Piper TTS</text>
  <text x="478" y="96" font-size="10.5" fill="#777" text-anchor="middle">voice synthesis</text>
  <text x="478" y="111" font-size="10.5" fill="#777" text-anchor="middle">local</text>

  <rect x="558" y="50" width="112" height="80" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="614" y="73" font-size="12" font-weight="600" fill="#333" text-anchor="middle">Full dome</text>
  <text x="614" y="91" font-size="10.5" fill="#777" text-anchor="middle">Unity 6 real-time</text>
  <text x="614" y="106" font-size="10.5" fill="#777" text-anchor="middle">dome rendering</text>
  <text x="614" y="121" font-size="10.5" fill="#777" text-anchor="middle">live captions</text>

  <line x1="126" y1="90" x2="150" y2="90" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="262" y1="90" x2="286" y2="90" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="398" y1="90" x2="422" y2="90" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="534" y1="90" x2="558" y2="90" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>

  <path d="M 150 152 L 670 152" stroke="#c5c5c5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="340" y="175" font-size="11" fill="#888" text-anchor="middle" font-style="italic">offline-first — the entire show loop runs on one exhibit PC, no cloud dependency</text>
</svg>
