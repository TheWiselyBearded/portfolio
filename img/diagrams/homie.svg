<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#ffffff"/>

  <!-- Reachy Mini (left) -->
  <text x="105" y="52" font-size="11" fill="#888" text-anchor="middle" font-style="italic">first embodied client</text>
  <rect x="20" y="60" width="170" height="150" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="105" y="82" font-size="13" font-weight="600" fill="#333" text-anchor="middle">Reachy Mini</text>
  <text x="34" y="104" font-size="11" fill="#555">room scanner (DA3)</text>
  <text x="34" y="122" font-size="11" fill="#555">face recognition</text>
  <text x="34" y="140" font-size="11" fill="#555">sentiment &amp; voice</text>
  <text x="34" y="158" font-size="11" fill="#555">episodic recorder</text>
  <text x="34" y="176" font-size="11" fill="#555">XR bridge</text>
  <text x="34" y="194" font-size="11" fill="#555">gestures &amp; expressions</text>

  <!-- VITURE glasses (left, below) -->
  <text x="105" y="268" font-size="11" fill="#888" text-anchor="middle" font-style="italic">first XR client</text>
  <rect x="20" y="276" width="170" height="92" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="105" y="298" font-size="13" font-weight="600" fill="#333" text-anchor="middle">VITURE glasses</text>
  <text x="34" y="320" font-size="11" fill="#555">relocalize into room scan</text>
  <text x="34" y="338" font-size="11" fill="#555">pinch + point raycast</text>
  <text x="34" y="356" font-size="11" fill="#555">follow / look-at modes</text>

  <!-- Homie core (center) -->
  <rect x="250" y="40" width="180" height="360" rx="10" fill="#fdfdfd" stroke="#b8cbe0" stroke-width="1.5"/>
  <text x="340" y="63" font-size="14" font-weight="600" fill="#333" text-anchor="middle">Homie core</text>

  <rect x="264" y="76" width="152" height="34" rx="6" fill="#4a7db5"/>
  <text x="340" y="97" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Event Bus</text>

  <rect x="264" y="118" width="152" height="48" rx="6" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="340" y="137" font-size="12" font-weight="600" fill="#333" text-anchor="middle">Agent runtime</text>
  <text x="340" y="154" font-size="10.5" fill="#777" text-anchor="middle">ReAct loop · tool router</text>

  <rect x="264" y="174" width="152" height="62" rx="6" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="340" y="193" font-size="12" font-weight="600" fill="#333" text-anchor="middle">Memory platform</text>
  <text x="340" y="210" font-size="10.5" fill="#777" text-anchor="middle">knowledge graph · episodes</text>
  <text x="340" y="225" font-size="10.5" fill="#777" text-anchor="middle">vector index · RAG fusion</text>

  <rect x="264" y="244" width="152" height="34" rx="6" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="340" y="265" font-size="12" font-weight="600" fill="#333" text-anchor="middle">State store</text>

  <rect x="264" y="286" width="152" height="48" rx="6" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="340" y="305" font-size="12" font-weight="600" fill="#333" text-anchor="middle">Spatial engine</text>
  <text x="340" y="322" font-size="10.5" fill="#777" text-anchor="middle">3D room maps · relocalization</text>

  <rect x="264" y="342" width="152" height="48" rx="6" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="340" y="361" font-size="12" font-weight="600" fill="#333" text-anchor="middle">GenAI platform</text>
  <text x="340" y="378" font-size="10.5" fill="#777" text-anchor="middle">Ollama local · cloud LLMs</text>

  <!-- Display surfaces (right) -->
  <rect x="490" y="60" width="170" height="110" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="575" y="82" font-size="13" font-weight="600" fill="#333" text-anchor="middle">Display surfaces</text>
  <text x="504" y="104" font-size="11" fill="#555">projector (Raspberry Pi)</text>
  <text x="504" y="122" font-size="11" fill="#555">phone / TV browser</text>
  <text x="504" y="140" font-size="11" fill="#555">web chat UI</text>
  <text x="504" y="158" font-size="11" fill="#555">generated LAN web apps</text>

  <!-- Claude Code (right) -->
  <rect x="490" y="196" width="170" height="76" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="575" y="218" font-size="13" font-weight="600" fill="#333" text-anchor="middle">Claude Code</text>
  <text x="504" y="240" font-size="11" fill="#555">MCP client of the home</text>
  <text x="504" y="258" font-size="11" fill="#555">builds apps on request</text>

  <!-- Cloud GPU (right) -->
  <rect x="490" y="298" width="170" height="70" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="575" y="320" font-size="13" font-weight="600" fill="#333" text-anchor="middle">Lambda Cloud</text>
  <text x="504" y="342" font-size="11" fill="#555">GPU inference jobs</text>
  <text x="504" y="360" font-size="11" fill="#555">deployed gen-AI apps</text>

  <!-- Arrows -->
  <line x1="190" y1="110" x2="250" y2="110" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="220" y="100" font-size="10" fill="#888" text-anchor="middle" font-style="italic">observations</text>
  <line x1="250" y1="150" x2="190" y2="150" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="220" y="168" font-size="10" fill="#888" text-anchor="middle" font-style="italic">speech · motion</text>

  <line x1="190" y1="318" x2="250" y2="318" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="220" y="308" font-size="10" fill="#888" text-anchor="middle" font-style="italic">shared map</text>

  <line x1="430" y1="112" x2="490" y2="112" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="460" y="102" font-size="10" fill="#888" text-anchor="middle" font-style="italic">render_card</text>

  <line x1="430" y1="232" x2="490" y2="232" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="460" y="222" font-size="10" fill="#888" text-anchor="middle" font-style="italic">MCP tools</text>

  <line x1="430" y1="332" x2="490" y2="332" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="460" y="322" font-size="10" fill="#888" text-anchor="middle" font-style="italic">jobs</text>
</svg>
