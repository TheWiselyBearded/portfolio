<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="680" height="250" fill="#ffffff"/>

  <!-- Row 1 -->
  <rect x="20" y="35" width="190" height="70" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="115" y="63" font-size="12.5" font-weight="600" fill="#333" text-anchor="middle">Time-lapse microscopy</text>
  <text x="115" y="82" font-size="10.5" fill="#777" text-anchor="middle">multi-hour video · 20 s/frame</text>

  <rect x="245" y="35" width="190" height="70" rx="8" fill="#4a7db5"/>
  <text x="340" y="58" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Instance segmentation</text>
  <text x="340" y="76" font-size="10.5" fill="#dce8f5" text-anchor="middle">YOLOv8 · Roboflow 3.0</text>
  <text x="340" y="91" font-size="10.5" fill="#dce8f5" text-anchor="middle">hand-labeled masks · ONNX</text>

  <rect x="470" y="35" width="190" height="70" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="565" y="58" font-size="12.5" font-weight="600" fill="#333" text-anchor="middle">Multi-object tracking</text>
  <text x="565" y="76" font-size="10.5" fill="#777" text-anchor="middle">btrack — Bayesian</text>
  <text x="565" y="91" font-size="10.5" fill="#777" text-anchor="middle">per-cell trajectories</text>

  <!-- Row 2 -->
  <rect x="20" y="150" width="190" height="70" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="115" y="173" font-size="12.5" font-weight="600" fill="#333" text-anchor="middle">Fusion &amp; lineage</text>
  <text x="115" y="191" font-size="10.5" fill="#777" text-anchor="middle">merge events · deaths</text>
  <text x="115" y="206" font-size="10.5" fill="#777" text-anchor="middle">cost-optimized stitching</text>

  <rect x="245" y="150" width="190" height="70" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="340" y="173" font-size="12.5" font-weight="600" fill="#333" text-anchor="middle">Validation gate</text>
  <text x="340" y="191" font-size="10.5" fill="#777" text-anchor="middle">auditable regime checks</text>
  <text x="340" y="206" font-size="10.5" fill="#777" text-anchor="middle">flags anomalies for review</text>

  <rect x="470" y="150" width="190" height="70" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="565" y="173" font-size="12.5" font-weight="600" fill="#333" text-anchor="middle">Outputs</text>
  <text x="565" y="191" font-size="10.5" fill="#777" text-anchor="middle">annotated video · figures</text>
  <text x="565" y="206" font-size="10.5" fill="#777" text-anchor="middle">per-track data</text>

  <!-- Arrows -->
  <line x1="210" y1="70" x2="245" y2="70" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="435" y1="70" x2="470" y2="70" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 565 105 L 565 127 L 115 127 L 115 150" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="210" y1="185" x2="245" y2="185" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="435" y1="185" x2="470" y2="185" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
