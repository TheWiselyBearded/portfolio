<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="680" height="300" fill="#ffffff"/>

  <!-- Inputs -->
  <rect x="14" y="38" width="150" height="66" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="89" y="62" font-size="11.5" font-weight="600" fill="#333" text-anchor="middle">Unity synthetic</text>
  <text x="89" y="80" font-size="10" fill="#777" text-anchor="middle">procedural scenes,</text>
  <text x="89" y="93" font-size="10" fill="#777" text-anchor="middle">perfect labels + GenAI realism</text>

  <rect x="14" y="150" width="150" height="66" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="89" y="174" font-size="11.5" font-weight="600" fill="#333" text-anchor="middle">Real AOT flights</text>
  <text x="89" y="192" font-size="10" fill="#777" text-anchor="middle">299 labeled flights,</text>
  <text x="89" y="205" font-size="10" fill="#777" text-anchor="middle">COCO + sequence manifest</text>

  <!-- Dataset -->
  <rect x="212" y="94" width="130" height="66" rx="8" fill="#4a7db5"/>
  <text x="277" y="122" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">Blended dataset</text>
  <text x="277" y="141" font-size="10" fill="#dce8f5" text-anchor="middle">DVC-versioned, drift-checked</text>

  <!-- Train -->
  <rect x="390" y="94" width="130" height="66" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="455" y="118" font-size="11.5" font-weight="600" fill="#333" text-anchor="middle">Train detectors</text>
  <text x="455" y="136" font-size="10" fill="#777" text-anchor="middle">RF-DETR · YOLOX</text>
  <text x="455" y="149" font-size="10" fill="#777" text-anchor="middle">DGX Spark · Lambda</text>

  <!-- Eval -->
  <rect x="546" y="94" width="122" height="66" rx="8" fill="#4a7db5"/>
  <text x="607" y="118" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">Sliced eval</text>
  <text x="607" y="136" font-size="10" fill="#dce8f5" text-anchor="middle">whole-frame,</text>
  <text x="607" y="149" font-size="10" fill="#dce8f5" text-anchor="middle">held-out flights · AP@50</text>

  <!-- Deploy -->
  <rect x="390" y="210" width="278" height="56" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="529" y="234" font-size="11.5" font-weight="600" fill="#333" text-anchor="middle">Perception-only deployment</text>
  <text x="529" y="252" font-size="10" fill="#777" text-anchor="middle">ONNX → TensorRT · ByteTrack identity tracking</text>

  <!-- arrows -->
  <path d="M 164 71 L 188 71 L 188 118 L 212 118" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 164 183 L 188 183 L 188 136 L 212 136" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="342" y1="127" x2="390" y2="127" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="127" x2="546" y2="127" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 607 160 L 607 210" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- feedback loop -->
  <path d="M 546 150 L 400 150 L 400 178 L 277 178 L 277 160" fill="none" stroke="#c5c5c5" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="400" y="193" font-size="10" fill="#999" text-anchor="middle" font-style="italic">failure analysis → targeted dataset revision → retrain</text>
</svg>
